name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # 1. Enable Remote Desktop
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 0

          Write-Host "RDP enabled."

      # 2. Create / Reset Admin
      - name: Create Admin Account
        shell: powershell
        run: |
          $Username = "NvDAdmin"
          $PasswordText = "P@ssw0rd1qazXSW@#"

          $Password = ConvertTo-SecureString `
            $PasswordText `
            -AsPlainText `
            -Force

          $User = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($User) {
              Write-Host "User already exists. Resetting password..."
              Set-LocalUser `
                -Name $Username `
                -Password $Password
          }
          else {
              Write-Host "Creating user..."
              New-LocalUser `
                -Name $Username `
                -Password $Password `
                -PasswordNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Write-Host "================================"
          Write-Host "Username: $Username"
          Write-Host "Password: $PasswordText"
          Write-Host "================================"

      # 3. Install Tailscale
      - name: Install Tailscale
        shell: powershell
        run: |
          $Installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$Installer`" /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 10

          Write-Host "Tailscale installed."

      # 4. Connect Tailscale
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          & $Tailscale up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server"

          Start-Sleep -Seconds 10

          $IP = & $Tailscale ip -4

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       WINDOWS RDP SERVER READY"
          Write-Host "=============================================="
          Write-Host "Tailscale IP : $IP"
          Write-Host "Username     : .\NvDAdmin"
          Write-Host "Password     : P@ssw0rd1qazXSW@#"
          Write-Host "=============================================="

      # 5. Check RDP
      - name: Check RDP
        shell: powershell
        run: |
          Write-Host "Checking RDP service..."

          Get-Service TermService

          Write-Host ""
          Write-Host "Checking port 3389..."

          Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

      # 6. Keep Runner Alive
      - name: Keep Server Alive
        shell: powershell
        run: |
          for ($i = 1; $i -le 350; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/350] RDP server is running..."
          }
